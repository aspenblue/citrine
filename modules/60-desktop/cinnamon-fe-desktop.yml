---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - mate-calc
        - engrampa
        - lxtask


  # -----------------------------------------------
  # webapp-manager package
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - aspenblue/xapps
    install:
      install-weak-deps: false
      packages:
        - webapp-manager   


  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:

          # Office
          - org.onlyoffice.desktopeditors

          # Web
          - com.getmailspring.Mailspring
