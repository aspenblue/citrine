---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - aspenblue/xapps
    install:
      install-weak-deps: false
      packages:
        - xviewer


  # -----------------------------------------------
  # Add xepub desktop localization
  # -----------------------------------------------

  - type: script
    scripts:
      - xepub-localization-fix.sh


  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          # Web
          - org.mozilla.firefox

          # Apps
          - io.github.kolunmi.Bazaar
