---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Docking install 
  # -----------------------------------------------

  - type: dnf
    repos:
      files:
        - docking-rpm.repo
      keys:
        - https://dl.cloudsmith.io/public/docking/docking-rpm/gpg.key
    install:
      packages:
        - docking
      install-weak-deps: false
