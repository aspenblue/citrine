---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Cinnamon packages
  # -----------------------------------------------

  - type: dnf
    group-install:
      with-optional: true
      packages:
        - cinnamon-desktop
    install:
      install-weak-deps: false
      packages:
        # Essential Mint themes and icons for a polished Cinnamon experience.
        - mint-themes
        - mint-y-icons
        - mint-x-icons
        - desktop-backgrounds-compat


  # -----------------------------------------------
  # Cinnamon spices fix
  # -----------------------------------------------

  - type: script
    scripts:
      - cinnamon-spices-fix.sh


  # -----------------------------------------------
  # Cinnamon spices install
  # -----------------------------------------------

  - type: script
    scripts:
      - cinnamon-cinnamenu-install.sh
