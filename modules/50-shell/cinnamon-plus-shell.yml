---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # plank-reloaded package
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - aspenblue/plank-reloaded
    install:
      install-weak-deps: false
      packages:
        - plank-reloaded


  # -----------------------------------------------
  # plank-reloaded autostart
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/plankreloaded
        destination: / 